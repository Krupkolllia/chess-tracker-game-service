server:
  port: 8081
  servlet:
    context-path: /api



security:
  gateway:
    secret: ${SHARED_GATEWAY_SECRET}

spring:
  application:
    name: GameService

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_LOCAL_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

    liquibase:
      enable: true
